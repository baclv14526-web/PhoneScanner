name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Dung setup-gradle thay vi ./gradlew vi repo nay chua co file
      # gradle-wrapper.jar nhi phan di kem. Neu ban tu chay `gradle wrapper`
      # o may local roi commit gradlew + gradle-wrapper.jar, co the doi lai
      # buoc "Build" ben duoi thanh `run: ./gradlew assembleDebug --no-daemon`
      - name: Setup Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
