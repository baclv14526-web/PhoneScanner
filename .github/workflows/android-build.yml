name: Build & Release Signed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Can quyen "contents: write" de workflow duoc phep tao/cap nhat GitHub Release
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # setup-gradle tu dong cache ~/.gradle/caches, ~/.gradle/wrapper va
      # dependency resolution giua cac lan chay -> lan build sau nhanh hon
      # dang ke vi khong phai tai lai dependency (CameraX, ML Kit...) tu dau.
      - name: Setup Gradle 8.14 (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
          cache-read-only: false

      # Giai ma keystore da encode base64 (luu trong GitHub Secret) ra file
      # nhi phan thuc te tren may CI. File nay CHI ton tai trong runner tam
      # thoi cua Actions, khong bao gio duoc commit vao repo.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Chua cau hinh Secret KEYSTORE_BASE64. Xem huong dan trong README.md muc 'Thiet lap ky so' truoc khi push."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore.jks

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_VERSION_CODE: ${{ github.run_number }}
          BUILD_VERSION_NAME: "1.0.${{ github.run_number }}"
        run: gradle assembleRelease --no-daemon --build-cache

      - name: Remove keystore file (don dep, khong luu lai tren runner)
        if: always()
        run: rm -f release.keystore.jks

      - name: Rename APK for de nhan dien
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/QuetSoGoi-v1.0.${{ github.run_number }}.apk

      # Luu artifact tren tab Actions (phong khi can debug lai ban build cu),
      # nhung day KHONG PHAI cach de nguoi dung tai ve cai dat - can dang
      # nhap GitHub va bi het han sau 90 ngay.
      - name: Upload build artifact (backup, khong dung de cai dat tren dien thoai)
        uses: actions/upload-artifact@v4
        with:
          name: QuetSoGoi-apk-run${{ github.run_number }}
          path: out/*.apk

      # Day la cach de nguoi dung cai dat tren dien thoai: 1 link Release cong
      # khai, tai truc tiep bang trinh duyet dien thoai, khong can dang nhap,
      # khong het han. Moi lan push se cap nhat lai release tag "latest" nay.
      - name: Publish to GitHub Releases (link tai on dinh de cai len dien thoai)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Quét Số Gọi - build #${{ github.run_number }}"
          body: |
            APK ký release, cài trực tiếp được trên điện thoại Android.
            Build tự động từ commit: ${{ github.sha }}

            **Cách cài:** Mở link .apk bên dưới bằng trình duyệt trên điện thoại,
            tải về rồi bấm mở file để cài (lần đầu cần bật "Cho phép cài đặt
            từ nguồn không xác định" cho trình duyệt bạn dùng).
          files: out/*.apk
          make_latest: true
