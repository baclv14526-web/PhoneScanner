name: Build & Release Signed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (co san keytool)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.14 (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
          cache-read-only: false

      # Tu tao keystore ky moi cho MOI lan build - khong can thiet lap gi
      # truoc, khong can secret nao. Mat khau sinh ngau nhien, chi ton tai
      # trong lan chay nay roi bi xoa, khong luu lai o dau ca.
      - name: Tu tao keystore va ky APK
        run: |
          set -e
          KS_FILE="${{ github.workspace }}/release.keystore.jks"
          KS_PW=$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 24)
          K_ALIAS="quetsogoi"

          echo "::add-mask::$KS_PW"

          keytool -genkeypair -v \
            -keystore "$KS_FILE" \
            -alias "$K_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PW" -keypass "$KS_PW" \
            -dname "CN=QuetSoGoi, OU=Personal, O=DiepVan, L=HaNoi, S=HaNoi, C=VN"

          {
            echo "KEYSTORE_PATH=$KS_FILE"
            echo "KEYSTORE_PASSWORD=$KS_PW"
            echo "KEY_ALIAS=$K_ALIAS"
            echo "KEY_PASSWORD=$KS_PW"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          BUILD_VERSION_CODE: ${{ github.run_number }}
          BUILD_VERSION_NAME: "1.0.${{ github.run_number }}"
        run: gradle assembleRelease --no-daemon --build-cache

      - name: Xoa keystore khoi runner
        if: always()
        run: rm -f release.keystore.jks

      - name: Doi ten APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/QuetSoGoi-v1.0.${{ github.run_number }}.apk

      - name: Upload build artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: QuetSoGoi-apk-run${{ github.run_number }}
          path: out/*.apk

      # Link tai on dinh, cong khai, khong het han - cach de cai tren dien thoai.
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Quét Số Gọi - build #${{ github.run_number }}"
          body: |
            APK đã ký (chữ ký tự sinh mới cho lần build này).
            Build từ commit: ${{ github.sha }}

            **Cách cài:** Mở link .apk bên dưới bằng trình duyệt trên điện thoại,
            tải về rồi bấm mở file để cài (lần đầu cần bật "Cho phép cài đặt
            từ nguồn không xác định").

            ⚠️ Mỗi lần build dùng chữ ký mới, nên nếu máy bạn đã cài bản
            trước đó, cần **gỡ cài đặt bản cũ** rồi mới cài bản này (không
            cài đè trực tiếp được).
          files: out/*.apk
          make_latest: true
